name: Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'

jobs:
  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: make jar
      - run: test -f dist/DustDiskSim.jar
      - uses: actions/upload-artifact@v4
        with:
          name: DustDiskSim-jar
          path: dist/DustDiskSim.jar
          retention-days: 7
